services:
  - type: web
    name: colab-command-center
    plan: starter
    region: oregon
    healthCheckPath: /api/healthz
    buildCommand: cd artifacts/colab-command-center && npm install && npm run build && mkdir -p ../../colab-command-center && cp -r dist ../../colab-command-center/ && cd ../../artifacts/api-server && npm install
    startCommand: cd artifacts/api-server && node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000