services:
  - type: web
    name: colab-command-center
    runtime: node
    plan: free
    buildCommand: pnpm install && pnpm run build
    startCommand: NODE_ENV=production PORT=10000 node artifacts/api-server/dist/index.js
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: "24"