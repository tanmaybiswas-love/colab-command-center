services:
  - type: web
    name: colab-command-center
    runtime: node
    plan: starter
    region: oregon
    buildCommand: pnpm install && pnpm run build
    startCommand: node artifacts/api-server/dist/index.js
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000