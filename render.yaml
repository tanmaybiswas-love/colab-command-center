services:
  - type: web
    name: cc-plus
    runtime: node
    plan: free
    buildCommand: pnpm install && pnpm --filter @workspace/colab-command-center build && pnpm --filter @workspace/api-server build
    startCommand: NODE_ENV=production PORT=10000 node artifacts/api-server/dist/index.js
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: "24"