services:
  - type: web_service
    name: colab-command-center
    runtime: node
    plan: starter
    region: oregon
    buildCommand: |
      echo "Starting build..."
      pnpm install
      pnpm run build
      echo "Build completed!"
    startCommand: pnpm start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000