services:
  - type: web
    name: colab-command-center
    plan: starter
    region: oregon
    healthCheckPath: /api/healthz
    buildCommand: cd artifacts/colab-command-center && npm install && npm run build && mkdir -p ../colab-command-center/dist && cp -r dist/public ../colab-command-center/dist/ && cd ../../artifacts/api-server && npm install
    startCommand: node artifacts/api-server/src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000