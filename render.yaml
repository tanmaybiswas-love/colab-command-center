services:
  - type: web_service
    name: colab-command-center
    runtime: node
    plan: starter
    region: oregon
    buildCommand: cd artifacts/colab-command-center && npm install && npm run build && cd ../api-server && npm install && npm run build && cd ../..
    startCommand: node artifacts/api-server/dist/index.js
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000